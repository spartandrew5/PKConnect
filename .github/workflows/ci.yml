name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Core - Build
        run: docker build . --target core-builder

      - name: Core - Test
        run: docker build . --target core-test

      - name: Connect - Build
        run: docker build . --target connect-builder

      - name: Connect - Test
        run: docker build . --target connect-test

      - name: Backend - Build
        run: docker build . --target backend-builder

      - name: UI - Build
        run: docker build . --target ui-publish

      - name: Desktop - Build
        run: docker build . --target desktop-builder
